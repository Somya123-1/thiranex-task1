<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somya | Thiranex Portfolio</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --primary: #6366f1;
            --card: #f8fafc;
            --border: #e2e8f0;
        }
        
        [data-theme="dark"] {
            --bg: #0f172a;
            --text: #f1f5f9;
            --primary: #818cf8;
            --card: #1e293b;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 2px solid var(--border);
            margin-bottom: 40px;
        }

        h1 {
            color: var(--primary);
            font-size: 2rem;
        }

        .theme-toggle {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        .theme-toggle:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: var(--card);
            border-radius: 15px;
            margin-bottom: 40px;
            border: 1px solid var(--border);
        }

        .hero h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
